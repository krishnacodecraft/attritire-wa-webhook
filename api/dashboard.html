<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Messages — Startup India</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,system-ui,sans-serif;background:#111b21;color:#e9edef;height:100vh;overflow:hidden;display:flex}
.sidebar{width:380px;min-width:380px;background:#111b21;border-right:1px solid #222d34;display:flex;flex-direction:column}
.sidebar-header{background:#202c33;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;min-height:60px}
.sidebar-header h2{font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px}
.green-dot{width:10px;height:10px;background:#25d366;border-radius:50%;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.sidebar-header .subtitle{font-size:11px;color:#8696a0;font-weight:400}
.conv-list{flex:1;overflow-y:auto}
.conv-item{padding:14px 16px;display:flex;align-items:center;gap:14px;cursor:pointer;border-bottom:1px solid #222d34;transition:background .15s;user-select:none}
.conv-item:hover{background:#202c33}
.conv-item.active{background:#2a3942}
.conv-avatar{width:48px;height:48px;min-width:48px;background:#2a3942;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:600;color:#aebac1}
.conv-info{flex:1;min-width:0}
.conv-name{font-size:16px;font-weight:500;margin-bottom:3px}
.conv-last{font-size:13px;color:#8696a0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv-meta{text-align:right;min-width:50px}
.conv-time{font-size:11px;color:#8696a0;margin-bottom:4px}
.conv-badge{display:inline-block;background:#25d366;color:#111b21;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px}
.main{flex:1;display:flex;flex-direction:column;background:#0b141a}
.chat-header{background:#202c33;padding:14px 20px;display:flex;align-items:center;gap:14px;min-height:60px}
.chat-avatar{width:40px;height:40px;background:#2a3942;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600}
.chat-name{font-size:16px;font-weight:500}
.chat-number{font-size:12px;color:#8696a0}
.chat-body{flex:1;overflow-y:auto;padding:20px 60px;background-image:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 30 L60 30 L60 60 L30 60z' fill='none' stroke='%23222d34' stroke-width='0.5'/%3E%3C/svg%3E")}
.chat-footer{background:#202c33;padding:10px 16px;display:flex;align-items:center;gap:12px}
.chat-footer input{flex:1;padding:10px 16px;background:#2a3942;border:none;border-radius:8px;color:#e9edef;font-size:14px;font-family:Inter,sans-serif;outline:none}
.chat-footer input::placeholder{color:#8696a0}
.chat-footer button{background:#25d366;color:#111b21;border:none;border-radius:50%;width:44px;height:44px;min-width:44px;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.chat-footer button:hover{background:#1da851;transform:scale(1.05)}
.chat-footer button:disabled{opacity:.4;cursor:default;transform:none}
.msg-bubble{max-width:65%;margin-bottom:4px;padding:8px 12px;border-radius:8px;font-size:14px;line-height:1.5;word-wrap:break-word}
.msg-in{background:#202c33;border-top-left-radius:0;margin-right:auto}
.msg-out{background:#005c4b;border-top-right-radius:0;margin-left:auto}
.msg-time{font-size:11px;color:#8696a0;margin-top:2px;text-align:right}
.msg-out .msg-time{color:#7dba92}
.empty-chat{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:#8696a0;text-align:center;padding:40px}
.empty-chat svg{width:80px;height:80px;margin-bottom:20px;opacity:.5}
.empty-chat h3{font-size:20px;margin-bottom:8px;color:#e9edef}
.empty-chat p{font-size:14px;max-width:400px;line-height:1.6}
@media(max-width:768px){.sidebar{width:100%;min-width:100%}.main{display:none}.main.show{display:flex;position:fixed;inset:0;z-index:100}}
</style>
</head>
<body>
<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div><h2>Startup India<span class="green-dot"></span></h2><div class="subtitle">WhatsApp Chatbot</div></div>
    <button onclick="loadConvs()" style="background:none;border:none;color:#8696a0;cursor:pointer;font-size:18px" title="Refresh">🔄</button>
  </div>
  <div class="conv-list" id="convList">
    <div style="padding:40px;text-align:center;color:#8696a0">Loading conversations...</div>
  </div>
</div>
<div class="main" id="mainPanel">
  <div class="empty-chat">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg>
    <h3>Startup India Chatbot</h3>
    <p>Select a conversation from the left to start chatting. Incoming WhatsApp messages appear here automatically.</p>
  </div>
</div>
<script>
let activeNumber = null;

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

function timeAgo(ts) {
  var s = (Date.now() - new Date(ts).getTime()) / 1000;
  if (s < 60) return 'now';
  if (s < 3600) return Math.floor(s / 60) + 'm';
  if (s < 86400) return Math.floor(s / 3600) + 'h';
  return Math.floor(s / 86400) + 'd';
}

async function loadConvs() {
  var el = document.getElementById('convList');
  try {
    var res = await fetch('/api/conversations');
    var convs = await res.json();
    if (!convs.length) {
      el.innerHTML = '<div style="padding:40px;text-align:center;color:#8696a0">No conversations yet.<br><small>Send a WhatsApp message to get started.</small></div>';
      return;
    }
    var html = '';
    for (var i = 0; i < convs.length; i++) {
      var c = convs[i];
      var activeClass = c.from === activeNumber ? ' active' : '';
      html += '<div class="conv-item' + activeClass + '" data-number="' + esc(c.from) + '" data-name="' + esc(c.from_name) + '">';
      html += '<div class="conv-avatar">' + (c.from_name || '?')[0].toUpperCase() + '</div>';
      html += '<div class="conv-info"><div class="conv-name">' + esc(c.from_name) + '</div>';
      html += '<div class="conv-last">' + esc(c.last_text || '') + '</div></div>';
      html += '<div class="conv-meta"><div class="conv-time">' + timeAgo(c.last_time) + '</div>';
      html += '<div class="conv-badge">' + c.count + '</div></div></div>';
    }
    el.innerHTML = html;

    // Attach click handlers
    var items = document.querySelectorAll('.conv-item');
    for (var j = 0; j < items.length; j++) {
      items[j].addEventListener('click', function() {
        openChat(this.getAttribute('data-number'), this.getAttribute('data-name'));
      });
    }
  } catch (e) {
    el.innerHTML = '<div style="padding:40px;text-align:center;color:#8696a0">Could not load</div>';
  }
}

async function openChat(number, name) {
  activeNumber = number;
  var panel = document.getElementById('mainPanel');
  panel.innerHTML = '';
  panel.innerHTML += '<div class="chat-header"><div class="chat-avatar">' + (name || '?')[0].toUpperCase() + '</div><div><div class="chat-name">' + esc(name) + '</div><div class="chat-number">' + number + '</div></div></div>';
  panel.innerHTML += '<div class="chat-body" id="chatBody"><div style="text-align:center;color:#8696a0;padding:20px">Loading...</div></div>';
  panel.innerHTML += '<div class="chat-footer"><input type="text" id="chatInput" placeholder="Type a message..." onkeydown="if(event.keyCode===13)sendMsg()"><button onclick="sendMsg()" id="sendBtn">▶</button></div>';
  panel.classList.add('show');
  loadConvs();
  await loadChat(number);
}

async function loadChat(number) {
  try {
    var res = await fetch('/api/messages/' + number);
    var msgs = await res.json();
    var el = document.getElementById('chatBody');
    if (!el) return;
    if (!msgs.length) {
      el.innerHTML = '<div style="text-align:center;color:#8696a0;padding:40px">No messages yet</div>';
      return;
    }
    var html = '';
    for (var i = 0; i < msgs.length; i++) {
      var m = msgs[i];
      var cls = m.direction === 'out' ? 'msg-out' : 'msg-in';
      html += '<div class="msg-bubble ' + cls + '"><div>' + esc(m.text) + '</div><div class="msg-time">' + timeAgo(m.timestamp) + '</div></div>';
    }
    el.innerHTML = html;
    el.scrollTop = el.scrollHeight;
  } catch (e) { console.error(e); }
}

async function sendMsg() {
  var inp = document.getElementById('chatInput');
  var btn = document.getElementById('sendBtn');
  var text = inp.value.trim();
  if (!text || !activeNumber) return;
  btn.disabled = true;
  try {
    await fetch('/api/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ to: activeNumber, text: text })
    });
    inp.value = '';
    await loadChat(activeNumber);
    await loadConvs();
  } catch (e) { console.error(e); }
  btn.disabled = false;
}

loadConvs();
setInterval(function() {
  loadConvs();
  if (activeNumber) loadChat(activeNumber);
}, 10000);
</script>
</body>
</html>
